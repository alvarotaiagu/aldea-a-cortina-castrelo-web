<!-- ============ cortina «La llave» (agente Entrada: partes/cortina.html + css/entrada.css + js/llave.js) ============
     GENERADO por scripts/entrada-llave.py a partir de scripts/entrada-cortina.plantilla.html: no se edita a mano.
     Una puerta de madera con su cerradura de hierro. La llave de la foto entra, gira un cuarto de vuelta y la puerta
     se abre hacia dentro: debajo está la portada ya en su sitio (el papel con el dibujo). Unos 2,8 s.

     El script de aquí va ANTES de la cortina: solo con JS se enseña (html.cortina-activa), así que sin JS no aparece
     nunca. Expone Cortina.cortina = { alAbrirse(fn), alRetirarse(fn), abrir(), retirar(), abierta, fuera, marcas }
     y lanza en document los eventos «cortina:abre» (cuando EMPIEZA a abrirse la puerta) y «cortina:fuera».
     Se retira SIEMPRE: sin JS (nunca se enseña), con movimiento reducido o densidad sobria (se retira al instante),
     y con red de seguridad: si js/llave.js no arranca en 2,5 s, o si algo se atasca, a los 8 s se va sola. -->
<script>
(function (d, w) {
  var h = d.documentElement, C = w.Cortina = w.Cortina || {}, abierta = false, fuera = false, alAbrir = [], alFuera = [];
  h.classList.add('js');
  function avisar(lista, nombre) {
    lista.splice(0).forEach(function (f) { try { f(); } catch (e) { console.warn(e); } });
    try { d.dispatchEvent(new CustomEvent(nombre)); } catch (e) {}
  }
  function abrir() { if (abierta) return; abierta = true; h.classList.add('cortina-abriendo'); avisar(alAbrir, 'cortina:abre'); }
  function retirar() {
    if (fuera) return;
    fuera = true;
    clearTimeout(red1); clearTimeout(red2);
    var c = d.getElementById('cortina');
    if (c) c.hidden = true;
    h.classList.remove('cortina-activa', 'cortina-abriendo');
    h.classList.add('cortina-fuera');
    abrir();
    avisar(alFuera, 'cortina:fuera');
  }
  C.cortina = {
    alAbrirse: function (f) { if (abierta) { try { f(); } catch (e) { console.warn(e); } } else alAbrir.push(f); },
    alRetirarse: function (f) { if (fuera) { try { f(); } catch (e) { console.warn(e); } } else alFuera.push(f); },
    abrir: abrir, retirar: retirar, enMarcha: false, marcas: {},
    get abierta() { return abierta; }, get fuera() { return fuera; }
  };
  var red1 = setTimeout(function () { if (!C.cortina.enMarcha) retirar(); }, 2500);
  var red2 = setTimeout(retirar, 8000);
  var quieto = false;
  try { quieto = w.matchMedia('(prefers-reduced-motion: reduce)').matches || h.classList.contains('densidad-sobria'); } catch (e) {}
  if (quieto) retirar();
  else {
    h.classList.add('cortina-activa');
    // la madera de la puerta se pide ya (solo si la cortina va a salir: con movimiento reducido no se baja)
    try { var l = d.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = 'img/llave/madera.webp'; d.head.appendChild(l); } catch (e) {}
  }
})(document, window);
</script>
